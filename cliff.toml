# Config git-cliff: CHANGELOG generato dai Conventional Commits (docs-as-code,
# mai a mano). Bump semver calcolato dai tipi di commit; tag di repo vX.Y.Z
# (i prefissi per package, es. events-v…, arriveranno con packages/*).

[changelog]
header = """
# Changelog

Generato da git-cliff dai Conventional Commits — non modificare a mano.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [non rilasciato]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[bump]
# Nessun tag ancora nel repo: la prima release parte allineata a package.json.
initial_tag = "v0.1.0"

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "Funzionalità" },
  { message = "^fix", group = "Fix" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^perf", group = "Prestazioni" },
  { message = "^docs", group = "Documentazione" },
  { message = "^test", group = "Test" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Manutenzione" },
]
