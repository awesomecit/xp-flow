<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>XP Flow - Dashboard Mobile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#faf8ff",
                        "tertiary": "#943700",
                        "outline-variant": "#c3c6d7",
                        "primary-container": "#2563eb",
                        "secondary": "#515f74",
                        "tertiary-container": "#bc4800",
                        "on-secondary-fixed": "#0d1c2e",
                        "surface-container": "#eaedff",
                        "background": "#faf8ff",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed-dim": "#ffb596",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-background": "#131b2e",
                        "on-surface": "#131b2e",
                        "surface-container-highest": "#dae2fd",
                        "tertiary-fixed": "#ffdbcd",
                        "inverse-primary": "#b4c5ff",
                        "surface-container-low": "#f2f3ff",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-container": "#57657a",
                        "surface-tint": "#0053db",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e2e7ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-on-surface": "#eef0ff",
                        "secondary-fixed": "#d5e3fc",
                        "surface-bright": "#faf8ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d2d9f4",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-fixed": "#360f00",
                        "on-error": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "inverse-surface": "#283044",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "outline": "#737686",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-surface-variant": "#434655",
                        "secondary-container": "#d5e3fc",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-secondary-fixed-variant": "#3a485b",
                        "primary": "#004ac6",
                        "surface-variant": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "xs": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xl": "32px",
                        "margin-desktop": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["JetBrains Mono", "monospace"],
                        "body-sm": ["Hanken Grotesk", "sans-serif"],
                        "title-lg": ["Hanken Grotesk", "sans-serif"],
                        "headline-md": ["Hanken Grotesk", "sans-serif"],
                        "headline-sm": ["Hanken Grotesk", "sans-serif"],
                        "body-md": ["Hanken Grotesk", "sans-serif"],
                        "headline-lg": ["Hanken Grotesk", "sans-serif"],
                        "label-sm": ["JetBrains Mono", "monospace"],
                        "body-lg": ["Hanken Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #faf8ff;
            color: #131b2e;
        }
        .text-label-md { font-size: 12px; line-height: 16px; letter-spacing: 0.02em; font-weight: 500; }
        .text-body-sm { font-size: 12px; line-height: 16px; font-weight: 400; }
        .text-title-lg { font-size: 18px; line-height: 24px; font-weight: 600; }
        .text-headline-md { font-size: 24px; line-height: 32px; letter-spacing: -0.01em; font-weight: 600; }
        .text-headline-sm { font-size: 20px; line-height: 28px; font-weight: 600; }
        .text-body-md { font-size: 14px; line-height: 20px; font-weight: 400; }
        .text-headline-lg { font-size: 30px; line-height: 36px; letter-spacing: -0.02em; font-weight: 700; }
        .text-label-sm { font-size: 10px; line-height: 14px; letter-spacing: 0.05em; font-weight: 500; }
        .text-body-lg { font-size: 16px; line-height: 24px; font-weight: 400; }
    </style>
</head>
<body class="font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-md text-headline-md fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-14 border-b border-outline-variant flat no shadows">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="terminal">terminal</span>
<span class="font-bold tracking-tight">XP Flow</span>
</div>
<span class="material-symbols-outlined text-secondary hover:bg-surface-container transition-colors p-xs rounded cursor-pointer" data-icon="settings">settings</span>
</header>
<!-- Main Content -->
<main class="flex-grow pt-[calc(3.5rem+16px)] px-margin-mobile pb-margin-mobile flex flex-col gap-lg md:hidden">
<!-- Zone A: Sprint Status -->
<section class="bg-surface-container-lowest border border-outline rounded-lg p-md">
<header class="border-b border-outline-variant pb-sm mb-sm flex justify-between items-center">
<h2 class="text-title-lg font-title-lg text-on-surface">Sprint Attivo: Issue #1</h2>
<span class="bg-surface-container px-xs py-[2px] rounded text-label-md font-label-md text-primary">IN_PROGRESS</span>
</header>
<div class="flex flex-col gap-sm">
<div class="flex flex-col gap-xs">
<span class="text-label-sm font-label-sm text-secondary uppercase">Scenario Attuale</span>
<p class="text-body-md font-body-md text-on-surface">Scenario 2: Token scaduto rigenerato</p>
</div>
<div class="flex flex-col gap-xs mt-sm">
<span class="text-label-sm font-label-sm text-secondary uppercase">Comando Recente</span>
<div class="bg-surface-container-low p-sm border border-outline-variant rounded font-label-md text-label-md text-on-surface-variant break-all">
                        /brainstorm &lt;idea&gt;
                    </div>
</div>
<div class="flex justify-between items-center mt-sm pt-sm border-t border-outline-variant">
<span class="text-label-sm font-label-sm text-secondary uppercase">Stima (SP)</span>
<span class="font-label-md text-label-md text-on-surface bg-surface-container px-sm py-[2px] rounded">4</span>
</div>
</div>
</section>
<!-- Zone B: Gate Status -->
<section class="bg-surface-container-lowest border border-outline rounded-lg p-md border-l-4 border-l-error">
<header class="border-b border-outline-variant pb-sm mb-sm">
<h2 class="text-title-lg font-title-lg text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-error" data-icon="gavel" style="font-variation-settings: 'FILL' 1;">gavel</span>
                    Gate &amp; Bloccanti
                </h2>
</header>
<div class="flex flex-col gap-sm">
<div class="bg-error-container p-sm rounded border border-error/20 flex flex-col gap-xs">
<p class="text-on-error-container text-body-md font-body-md font-semibold">Scenario 2 bloccato in Pair-Review ⚠</p>
<p class="text-on-error-container text-body-sm font-body-sm">Escalation a Opus richiesta</p>
</div>
<div class="flex gap-sm mt-sm">
<button class="flex-1 bg-surface-container text-on-surface-variant font-label-md text-label-md py-sm border border-outline-variant rounded hover:bg-surface-container-high transition-colors">Ignora (Rischioso)</button>
<button class="flex-1 bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded hover:opacity-90 transition-opacity">Richiedi Escalation</button>
</div>
</div>
</section>
</main>
<!-- Desktop Navigation Overlay/Fallback (Hidden on mobile as requested, just a structural hint) -->
<div class="hidden md:flex flex-col border-r border-outline-variant py-margin-desktop fixed left-0 top-0 h-full w-[240px] bg-surface z-40">
<!-- Drawer content would go here per JSON, but task focuses on Mobile Dashboard Zone A/B -->
</div>
</body></html>
