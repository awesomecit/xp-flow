<!DOCTYPE html>

<html class="dark" lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>XP Flow - Mobile Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#574425",
                        "tertiary-fixed-dim": "#dec29a",
                        "outline": "#76777d",
                        "error": "#ba1a1a",
                        "secondary": "#505f76",
                        "surface-bright": "#f8f9ff",
                        "primary-fixed": "#dae2fd",
                        "on-error": "#ffffff",
                        "surface-variant": "#d4e4fa",
                        "inverse-surface": "#233143",
                        "surface-container-highest": "#d4e4fa",
                        "on-surface-variant": "#45464d",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "secondary-container": "#d0e1fb",
                        "inverse-on-surface": "#e9f1ff",
                        "on-secondary": "#ffffff",
                        "primary": "#000000",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-fixed": "#fcdeb5",
                        "on-background": "#0d1c2d",
                        "on-tertiary-container": "#98805d",
                        "surface-dim": "#ccdbf2",
                        "surface-container-low": "#eef4ff",
                        "on-surface": "#0d1c2d",
                        "primary-fixed-dim": "#bec6e0",
                        "tertiary": "#000000",
                        "on-tertiary-fixed": "#271901",
                        "surface-container": "#e5efff",
                        "surface-tint": "#565e74",
                        "on-primary-container": "#7c839b",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary-container": "#54647a",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary": "#ffffff",
                        "primary-container": "#131b2e",
                        "outline-variant": "#c6c6cd",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-container-high": "#dbe9ff",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary-container": "#271901",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#bec6e0",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-compact": "8px",
                        "unit": "4px",
                        "gutter": "12px",
                        "margin-page": "24px",
                        "padding-card": "16px"
                    },
                    "fontFamily": {
                        "data-mono": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "data-mono": ["13px", { "lineHeight": "16px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0d1c2d; color: #bec6e0; }
        .border-subtle { border-color: #1E293B; }
        .bg-card { background-color: #131b2e; }
        .text-muted { color: #7c839b; }
        .text-ok { color: #b7c8e1; } /* using secondary-fixed-dim for neutral/ok state in dark theme */
    </style>
</head>
<body class="min-h-screen flex flex-col pt-14 px-4 pb-24 md:hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface dark:bg-surface-container-low border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" style="font-variation-settings: 'FILL' 0;">terminal</span>
<h1 class="text-headline-md font-headline-md font-bold tracking-tight text-primary dark:text-inverse-primary">XP Flow</h1>
</div>
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container dark:hover:bg-surface-container-highest p-1 rounded transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</header>
<main class="flex-1 flex flex-col gap-gutter mt-margin-page">
<!-- Zone A: Top Empty State (Sprint) -->
<section class="bg-card border border-subtle rounded flex flex-col p-padding-card gap-stack-compact">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-ok" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex flex-col gap-1">
<h2 class="text-headline-md font-headline-md text-inverse-primary">Nessuno sprint attivo</h2>
<p class="text-body-sm font-body-sm text-muted">Ultimo sprint chiuso: issue #1 · 3/3 SP</p>
</div>
</div>
<div class="mt-4 bg-[#0b1c30] border border-[#1E293B] rounded p-3 font-data-mono text-data-mono text-inverse-primary flex items-center gap-2">
<span class="text-muted">&gt;</span>
<span>/brainstorm &lt;prossima idea&gt;</span>
</div>
</section>
<!-- Zone B: Bottom Empty State (Gates) -->
<section class="bg-card border border-subtle rounded flex items-center p-padding-card gap-3">
<span class="material-symbols-outlined text-ok" style="font-variation-settings: 'FILL' 1;">done_all</span>
<span class="text-body-md font-body-md text-inverse-primary">Nessun gate pendente ✓</span>
</section>
<!-- Connectors Section (Footer) -->
<section class="mt-auto pt-margin-page">
<h3 class="text-label-caps font-label-caps text-muted uppercase mb-3">Connettori</h3>
<div class="flex flex-col gap-2">
<button class="flex items-center justify-between w-full p-3 bg-card border border-subtle rounded hover:bg-[#1a253c] transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">code</span>
<span class="text-body-md font-body-md text-inverse-primary">GitHub</span>
</div>
<span class="text-label-caps font-label-caps text-ok">Connesso</span>
</button>
<button class="flex items-center justify-between w-full p-3 bg-card border border-subtle rounded hover:bg-[#1a253c] transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">webhook</span>
<span class="text-body-md font-body-md text-inverse-primary">Stitch</span>
</div>
<span class="text-label-caps font-label-caps text-ok">Connesso</span>
</button>
<button class="flex items-center justify-between w-full p-3 bg-card border border-subtle rounded hover:bg-[#1a253c] transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-inverse-primary" style="font-variation-settings: 'FILL' 0;">favorite</span>
<span class="text-body-md font-body-md text-inverse-primary">Lovable</span>
</div>
<span class="text-label-caps font-label-caps text-ok">Connesso</span>
</button>
</div>
</section>
</main>
</body></html>
